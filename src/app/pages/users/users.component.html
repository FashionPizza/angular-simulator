<section class="users">
  <h1 class="users__title">Пользователи</h1>

  <app-user-create (create)="onCreateUser($event)" />

  <app-users-filter (filterChange)="onFilterChange($event)" />

  @if ((filteredUsers$ | async); as users) {
    @if (users.length > 0) {
      <div class="users__count">
        {{ users.length | plural:'пользователей':'пользователя':'пользователь' }}
      </div>
      
      <div class="users__list">
        @for (user of users; track user.id) {
          <app-user-card [user]="user" (delete)="onDeleteUser($event)" />
        }
      </div>
    } @else {
      <div class="users__empty">
        Нет пользователей для отображения
      </div>
    }
  }
</section>
